&lt;size:10&gt;Python|SQL|ORACLE</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="635.8398" x="20" y="38.5645">Flujo de datos de productividad de maquinas en granjas</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="489.0586" x="93.3906" y="54.4199">Automatizaci&#243;n del registro de la jornada laboral en m&#225;quinas agr&#237;colas</text><text fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="113.5986" x="281.1206" y="66.5322">Python|SQL|ORACLE</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="342.2505" x="166.7947" y="82.6357"/><rect fill="#CAFFC4" height="207.8594" style="stroke:#CAFFC4;stroke-width:1;" width="193.2959" x="166.7947" y="82.6357"/><ellipse cx="264.4426" cy="118.5889" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="170.3398" x="179.2727" y="148.5889"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.3398" x="189.2727" y="169.7275">Consumir datos de la API</text><line style="stroke:#000000;stroke-width:1.5;" x1="166.7947" x2="166.7947" y1="82.6357" y2="290.4951"/><rect fill="#F0CA92" height="207.8594" style="stroke:#F0CA92;stroke-width:1;" width="147.0938" x="360.0906" y="82.6357"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="137.0938" x="366.0906" y="202.5576"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.0938" x="376.0906" y="223.6963">Insertar datos en la</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.7793" x="376.0906" y="237.665">tabla MAQUINARIA</text><ellipse cx="434.6375" cy="280.4951" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="428.4503" x2="440.8246" y1="274.3079" y2="286.6823"/><line style="stroke:#222222;stroke-width:2.5;" x1="440.8246" x2="428.4503" y1="274.3079" y2="286.6823"/><line style="stroke:#000000;stroke-width:1.5;" x1="360.0906" x2="360.0906" y1="82.6357" y2="290.4951"/><line style="stroke:#000000;stroke-width:1.5;" x1="507.1843" x2="507.1843" y1="82.6357" y2="290.4951"/><line style="stroke:#181818;stroke-width:1;" x1="264.4426" x2="264.4426" y1="128.5889" y2="148.5889"/><polygon fill="#181818" points="260.4426,138.5889,264.4426,148.5889,268.4426,138.5889,264.4426,142.5889" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="434.6375" x2="434.6375" y1="250.4951" y2="270.4951"/><polygon fill="#181818" points="430.6375,260.4951,434.6375,270.4951,438.6375,260.4951,434.6375,264.4951" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="264.4426" x2="264.4426" y1="182.5576" y2="187.5576"/><line style="stroke:#181818;stroke-width:1;" x1="264.4426" x2="434.6375" y1="187.5576" y2="187.5576"/><line style="stroke:#181818;stroke-width:1;" x1="434.6375" x2="434.6375" y1="187.5576" y2="202.5576"/><polygon fill="#181818" points="430.6375,192.5576,434.6375,202.5576,438.6375,192.5576,434.6375,196.5576" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacing" textLength="183.2959" x="171.7947" y="99.3438">API solinftec.com [*]</text><text fill="#000000" font-family="sans-serif" font-size="18" lengthAdjust="spacing" textLength="129.0234" x="369.1257" y="99.3438">DB Oracle 19c</text><g class="footer" data-source-line="3"><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="317.583" x="179.1284" y="299.7773">Se automatiz&#243; la captura de datos de jornada de las m&#225;quinas,</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="273.5547" x="202.7319" y="311.418">reemplazando las bit&#225;coras de papel.El nuevo sistema</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="296.7041" x="189.5679" y="323.0586">asegura la precisi&#243;n de los datos y habilita el monitoreo en</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="209.1406" x="233.3496" y="334.6992">tiempo real de la productividad, lo que se</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="219.3311" x="228.2544" y="346.3398">traduce en una optimizaci&#243;n efectiva de los</text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="305.5225" x="185.1587" y="357.9805">recursos y una gesti&#243;n m&#225;s &#225;gil de las labores en las granjas</text></g><!--SRC=[LLBDQjmm4BxxAGPwA9GGDailsPO5rurX8Mt-wAdRmrYUTRJ8aYED0bdyCli0FUKH_68TUUssEHXaQxwV-JwpPaFmEUW3hPQBTMdYta5DK2Exa0wTTtLKh9zrZNNwqE9Jr1O3a8N6ezrZsDeJmSLodKTsBR8-eDB3gnM00K-D3kn7NeEmTzvYZNAid4UJUDhXE95YuuVVofd_I1VhsnT-TBP_kBlkR-xpulegUm-bSqmUbBFoj6GPlNOGNEMJI82MH0T3jZlDFH3WR6ruJJOKTXmzlbbsjbPF7BEjiwsLBQZj31xGrcwyhJGFHvL4nfom8tD-PS16UXOZiZ6rA3WCr2GTaUmyAHscNC0apL7v1HwnqaOpWiJLEglPUN8fcQrbBRfEv2MgKu1lAZaJ7dYA1854Z3tA5ILaj0YkOzt-xO9sb50uYs-j-8a-Z0xIU4E1nqbPFC1mRBIPenZBeh7qz3eLdsNzko8lo-9Zdzzk97sZxOv9dKibyFF3hpuBqWjdgyBP45lj_qKjUmZaKs8e5qL-kUo_Ve4RZqf-nujBrMUhZGta1JvXHcM90ok1VillVco-v_URN1Z8rdy0]--></g></svg>